<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pratinjau LMS Sekolah</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#19231f;background:#f5f7f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}.side{background:#142b24;color:#e9f0e9;padding:24px 16px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.logo{width:36px;height:36px;border-radius:11px;background:#c8f169;color:#20371e;display:grid;place-items:center;font-weight:800}.brand strong{display:block;font-size:15px;letter-spacing:-.2px}.brand small{display:block;color:#aebdb3;font-size:11px;margin-top:3px}.switch-wrap{padding:0 8px}.label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#93a89a;margin-bottom:8px;display:block}.role-select{background:#203c32;color:#f6fbf3;border:1px solid #385547;border-radius:10px;padding:11px 12px;width:100%;font:inherit;font-size:13px;outline:none}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#bdcbc1;padding:11px 12px;border-radius:9px;text-align:left;font:inherit;font-size:13px;display:flex;gap:11px;align-items:center;cursor:pointer}.nav button:hover{background:#203c32;color:white}.nav button.active{background:#c8f169;color:#1c3325;font-weight:700}.nav .icon{width:18px;text-align:center;font-size:15px}.nav-group{padding:0 7px}.nav-title{font-size:10px;letter-spacing:1px;color:#789185;text-transform:uppercase;padding:10px 12px}.side-bottom{margin-top:auto;border-top:1px solid #2c483d;padding:15px 8px 0;color:#aebdb3;font-size:11px;line-height:1.55}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid #e7ebe6;display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:15px}.crumb{font-size:12px;color:#77837b}.crumb b{color:#27352d;font-weight:600}.right{display:flex;align-items:center;gap:20px}.semester{border:1px solid #e4e9e3;border-radius:8px;background:white;color:#37443b;padding:9px 12px;font:inherit;font-size:12px}.user{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e6eedb;color:#344733;font-weight:700;display:grid;place-items:center}.user small{display:block;color:#849087;margin-top:2px}.page{padding:30px 34px;max-width:1400px;margin:auto}.eyebrow{color:#708077;font-size:12px;margin:0 0 8px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.heading h1{margin:0;font-size:25px;letter-spacing:-.7px;font-weight:650;color:#1c2922}.heading p{margin:7px 0 0;color:#7b877e;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #dce3dc;background:#fff;color:#33443a;border-radius:8px;padding:10px 14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}.btn:hover{background:#f7faf5}.btn.primary{background:#263f32;border-color:#263f32;color:#fff}.btn.lime{background:#c8f169;border-color:#c8f169;color:#20371e}.btn.soft{background:#edf4e7;border-color:#e3ecdb;color:#38533e}.btn.small{padding:7px 10px;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.stat{padding:17px;background:#fff;border:1px solid #e8ece7;border-radius:12px}.stat-head{display:flex;align-items:center;justify-content:space-between;color:#758178;font-size:11px}.stat-icon{width:29px;height:29px;border-radius:9px;background:#f0f5eb;display:grid;place-items:center;color:#3c6140}.stat strong{display:block;font-size:25px;letter-spacing:-.8px;margin-top:12px;font-weight:650}.stat-foot{font-size:11px;color:#849087;margin-top:5px}.positive{color:#4b8750;font-weight:600}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,.9fr);gap:16px;margin-bottom:16px}.panel{background:#fff;border:1px solid #e8ece7;border-radius:12px;padding:18px 20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.panel-head h2{font-size:14px;margin:0;font-weight:650}.muted{font-size:11px;color:#879188}.chart{height:190px;display:flex;align-items:end;gap:12px;padding:14px 6px 0;border-bottom:1px solid #e7ece6;background:repeating-linear-gradient(to bottom,transparent 0,transparent 46px,#f0f3ef 47px,#f0f3ef 48px)}.bar-wrap{flex:1;height:100%;display:flex;align-items:end;justify-content:center;gap:4px;position:relative}.bar{width:13px;border-radius:4px 4px 0 0;background:#c8f169}.bar.alt{background:#dce5d8}.chart-labels{display:flex;justify-content:space-around;color:#89938b;font-size:10px;padding-top:8px}.legend{display:flex;gap:15px;font-size:10px;color:#77837b}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c8f169;margin-right:5px}.dot.alt{background:#dce5d8}.progress-row{margin:13px 0}.progress-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:7px}.track{height:6px;background:#edf1eb;border-radius:9px;overflow:hidden}.fill{height:100%;background:#91bf51;border-radius:9px}.feed{display:grid;gap:16px}.feed-row{display:flex;gap:11px;align-items:flex-start;font-size:11px;color:#5d6a61;line-height:1.45}.feed-icon{width:29px;height:29px;flex:none;border-radius:9px;background:#f0f5eb;display:grid;place-items:center}.feed-row b{color:#26362d;font-weight:600}.feed-row small{display:block;color:#9aa39b;margin-top:3px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}th{text-align:left;color:#88938a;font-weight:600;padding:10px 10px;border-bottom:1px solid #edf0ec}td{padding:12px 10px;border-bottom:1px solid #f0f2ef;color:#536057}tbody tr:last-child td{border-bottom:0}td strong{color:#29372f;font-weight:600}.student-link{border:0;padding:0;background:transparent;color:#345945;font:inherit;font-weight:650;cursor:pointer}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:600}.badge.green{background:#edf5e8;color:#537b40}.badge.amber{background:#fbf1dd;color:#9a7132}.badge.gray{background:#eef1ee;color:#6d786f}.badge.red{background:#f9e9e5;color:#a15e50}.row-actions{display:flex;gap:6px}.list{display:grid;gap:8px}.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf0ec}.list-item:last-child{border:0}.list-item strong{font-size:12px;font-weight:600}.list-item small{display:block;color:#879188;margin-top:4px;font-size:10px}.empty-note{font-size:12px;color:#7e8a81;padding:10px 0}.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 17px;border-radius:11px;background:#edf4e7;margin-bottom:16px;color:#35513b;font-size:12px}.banner b{font-weight:650}.banner span{color:#687d68}.filters{display:flex;align-items:center;gap:9px}.filters select,.filters input{border:1px solid #e2e8e1;border-radius:8px;padding:9px 11px;background:#fff;color:#344138;font:inherit;font-size:11px}.tabs{display:flex;gap:18px;border-bottom:1px solid #e9ede8;margin-bottom:16px}.tabs button{padding:0 1px 11px;border:0;border-bottom:2px solid transparent;background:none;color:#829087;font:inherit;font-size:12px;cursor:pointer}.tabs button.active{border-color:#314e3c;color:#314e3c;font-weight:650}.toast{position:fixed;right:22px;bottom:22px;background:#20392e;color:white;padding:12px 16px;border-radius:9px;font-size:12px;box-shadow:0 8px 30px #15251c33;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translateY(0)}.mobile-menu{display:none;border:0;background:none;font-size:22px;color:#35493b}.mobile-nav{display:none}.person{display:flex;align-items:center;gap:11px}.person .avatar{width:42px;height:42px}.person small{display:block;color:#839087;font-size:11px;margin-top:3px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.page{padding:24px}.top{padding:0 24px}}
@media(max-width:720px){.shell{grid-template-columns:1fr}.side{display:none}.top{height:62px;padding:0 17px}.mobile-menu{display:block}.crumb{display:flex;align-items:center;gap:10px}.page{padding:21px 16px}.heading{display:block}.heading .actions{margin-top:15px}.right{gap:10px}.semester{max-width:135px;padding:8px 8px}.user>div:last-child{display:none}.cards{gap:9px}.stat{padding:13px}.stat strong{font-size:22px}.layout{gap:12px}.panel{padding:15px}.mobile-nav.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#fff;padding:10px 16px;border-bottom:1px solid #e7ebe6}.mobile-nav button{border:0;background:#f4f7f2;padding:10px;border-radius:7px;text-align:left;color:#435248;font:inherit;font-size:11px}.banner{align-items:flex-start;flex-direction:column}.filters{flex-wrap:wrap}.filters select{max-width:100%}}
@media(max-width:390px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.heading h1{font-size:22px}.right .semester{font-size:10px}.stat-foot{font-size:10px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><div class="logo">S</div><div><strong>Sekolah Cendekia</strong><small>Learning management system</small></div></div>
  <div class="switch-wrap"><span class="label">Pratinjau sebagai</span><select class="role-select" id="roleSelect" aria-label="Pilih peran"><option value="admin">Admin</option><option value="kepsek">Kepala Sekolah</option><option value="guru">Guru</option><option value="orangtua">Orang Tua</option><option value="siswa">Siswa</option></select></div>
  <div class="nav-group"><div class="nav-title">Menu utama</div><nav class="nav" id="sideNav"></nav></div>
  <div class="side-bottom">Tahun ajaran 2026/2027<br>Semester Ganjil · Demo interaktif</div>
</aside>
<main class="main">
  <header class="top"><div class="crumb"><button class="mobile-menu" id="mobileMenu" aria-label="Buka menu">☰</button><span>Portal sekolah</span><span>›</span><b id="crumbTitle">Ringkasan</b></div><div class="right"><select class="semester" aria-label="Semester"><option>Semester Ganjil 2026/2027</option><option>Semester Genap 2025/2026</option></select><div class="user"><div class="avatar" id="userAvatar">AD</div><div><span id="userName">Ayu Dewi</span><small id="userRole">Administrator</small></div></div></div></header>
  <nav class="mobile-nav" id="mobileNav"></nav>
  <section class="page" id="page" aria-live="polite"></section>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const roleData={
 admin:{label:'Administrator',name:'Ayu Dewi',initial:'AD',menu:[['Ringkasan','home','⌂'],['Data master','master','▦'],['Pengaturan','settings','⚙'],['KPI siswa','kpi','◷'],['Audit perubahan','audit','≡']]},
 kepsek:{label:'Kepala Sekolah',name:'Budi Santoso',initial:'BS',menu:[['Ringkasan','home','⌂'],['KPI siswa','kpi','◷'],['Laporan sekolah','reports','▤'],['Kehadiran guru','teacher-attendance','✓']]},
 guru:{label:'Guru · Wali kelas 8A',name:'Rina Puspita',initial:'RP',menu:[['Beranda','home','⌂'],['Absensi siswa','attendance','✓'],['Input nilai','grades','▤'],['Penilaian perilaku','behavior','♡'],['Kehadiran saya','my-attendance','◷']]},
 orangtua:{label:'Orang Tua',name:'Dewi Lestari',initial:'DL',menu:[['Anak saya','home','⌂'],['Rapor anak','report','▤'],['Pengumuman','announcements','◉']]},
 siswa:{label:'Siswa · Kelas 8A',name:'Nadia Putri',initial:'NP',menu:[['Rapor saya','home','⌂'],['Kehadiran','attendance','✓'],['Jadwal pelajaran','schedule','▦'],['Profil','profile','○']]}
};
let role='admin', current='home', selectedStudent='Nadia Putri';
const students=[['Nadia Putri','8A','88,4','96%','Baik','Dipublikasikan'],['Rafi Maulana','8A','82,7','91%','Baik','Dipublikasikan'],['Salsa Nabila','8A','—','88%','—','Belum lengkap'],['Dimas Pratama','8B','76,2','84%','Cukup','Draft'],['Alya Zahra','8B','91,6','98%','Sangat Baik','Dipublikasikan']];
const el=s=>document.querySelector(s);
function toast(message){const box=el('#toast');box.textContent=message;box.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>box.classList.remove('show'),2400)}
function setRole(next){role=next;current=roleData[role].menu[0][1];el('#roleSelect').value=role;el('#userName').textContent=roleData[role].name;el('#userRole').textContent=roleData[role].label;el('#userAvatar').textContent=roleData[role].initial;render()}
function navButton(item,mobile=false){return `<button class="${current===item[1]?'active':''}" data-page="${item[1]}">${mobile?'':`<span class="icon">${item[2]}</span>`}${item[0]}</button>`}
function renderNav(){const items=roleData[role].menu;el('#sideNav').innerHTML=items.map(i=>navButton(i)).join('');el('#mobileNav').innerHTML=items.map(i=>navButton(i,true)).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;el('#mobileNav').classList.remove('open');render()})}
function heading(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${roleData[role].label} <span style="padding:0 5px">/</span> Semester Ganjil 2026/2027</div><h1>${title}</h1><p>${sub}</p></div>${action?`<div class="actions">${action}</div>`:''}</div>`}
function stats(items){return `<div class="cards">${items.map(x=>`<div class="stat"><div class="stat-head">${x[0]}<span class="stat-icon">${x[3]||'◦'}</span></div><strong>${x[1]}</strong><div class="stat-foot">${x[2]}</div></div>`).join('')}</div>`}
function table(rows,headers){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function adminHome(){return heading('Ringkasan sekolah','Pantau kegiatan belajar dan progres semester berjalan.',`<button class="btn" data-action="Unduh ringkasan">↓&nbsp; Unduh ringkasan</button>`)+stats([['Siswa aktif','486','+12 dari semester lalu','♙'],['Guru aktif','32','Semua kelas terampu','♧'],['Kehadiran hari ini','94,8%','Naik 2,1% minggu ini','✓'],['KPI dipublikasikan','68%','331 dari 486 siswa','◷']])+`<div class="layout"><section class="panel"><div class="panel-head"><div><h2>Progres pembelajaran</h2><span class="muted">Kelengkapan data semester ini</span></div><div class="legend"><span><i class="dot"></i>Saat ini</span><span><i class="dot alt"></i>Sebelumnya</span></div></div><div class="chart">${[58,72,65,83,69,92,76,88].map((n,i)=>`<div class="bar-wrap"><div class="bar alt" style="height:${Math.max(35,n-13)}%"></div><div class="bar" style="height:${n}%"></div></div>`).join('')}</div><div class="chart-labels"><span>Jul</span><span>Agu</span><span>Sep</span><span>Okt</span><span>Nov</span><span>Des</span><span>Jan</span><span>Feb</span></div><div class="progress-row"><div class="progress-label"><span>Nilai terisi</span><b>82%</b></div><div class="track"><div class="fill" style="width:82%"></div></div></div><div class="progress-row"><div class="progress-label"><span>Penilaian perilaku</span><b>74%</b></div><div class="track"><div class="fill" style="width:74%"></div></div></div></section><section class="panel"><div class="panel-head"><h2>Perlu perhatian</h2><button class="btn small" data-page="kpi">Lihat KPI</button></div><div class="feed"><div class="feed-row"><div class="feed-icon">◷</div><div><b>155 KPI</b> menunggu publikasi<small>8 kelas · pembaruan 12 menit lalu</small></div></div><div class="feed-row"><div class="feed-icon">▤</div><div><b>3 kelas</b> belum melengkapi nilai UTS<small>Terakhir diperbarui hari ini</small></div></div><div class="feed-row"><div class="feed-icon">✓</div><div><b>2 permohonan izin</b> menunggu tinjauan<small>Guru · butuh persetujuan</small></div></div><div class="feed-row"><div class="feed-icon">♙</div><div><b>Semester aktif</b> berjalan normal<small>Ganjil 2026/2027 · berakhir 18 Desember</small></div></div></div></section></div><section class="panel"><div class="panel-head"><div><h2>Ringkasan KPI siswa</h2><span class="muted">Status per kelas</span></div><button class="btn small" data-page="kpi">Buka pengelolaan KPI&nbsp; →</button></div>${table([['8A','32','32','25','7','<span class="badge green">78% terbit</span>'],['8B','30','28','20','10','<span class="badge amber">67% terbit</span>'],['7A','34','33','29','5','<span class="badge green">85% terbit</span>'],['9A','31','30','27','4','<span class="badge green">87% terbit</span>']],['Kelas','Jumlah siswa','Data lengkap','Terbit','Perlu ditinjau','Progres'])}</section>`}
function kpiPage(){return heading('KPI siswa','Tinjau hasil per kelas sebelum dibagikan kepada siswa dan orang tua.',`<button class="btn" data-action="Ekspor rekap KPI">↓&nbsp; Ekspor</button>`)+`<div class="banner"><div><b>Periode penilaian dibuka</b><br><span>Semester Ganjil 2026/2027 · Bobot nilai 50% · Kehadiran 30% · Perilaku 20%</span></div><button class="btn soft small" data-page="settings">Lihat pengaturan</button></div>`+stats([['Siswa dihitung','486','Seluruh kelas semester aktif','♙'],['Lengkap','431','Siap ditinjau','✓'],['Belum lengkap','55','Perlu data tambahan','◷'],['Sudah dipublikasikan','331','68% dari seluruh siswa','◉']])+`<section class="panel"><div class="panel-head"><div><h2>Hasil per siswa</h2><span class="muted">Skor dibekukan setelah publikasi</span></div><div class="filters"><select aria-label="Filter kelas"><option>Semua kelas</option><option>8A</option><option>8B</option><option>9A</option></select><select aria-label="Filter status"><option>Semua status</option><option>Belum lengkap</option><option>Draft</option><option>Dipublikasikan</option></select></div></div><div class="actions" style="margin-bottom:14px"><button class="btn primary" data-action="Hitung ulang KPI">⟳&nbsp; Hitung ulang</button><button class="btn lime" data-action="Publikasikan KPI lengkap">Publikasikan yang lengkap&nbsp; →</button></div>${table(students.map(s=>[`<button class="student-link" data-student="${s[0]}">${s[0]}</button>`,s[1],s[2],s[3],s[4],s[2]==='—'?'—':s[2],s[5]==='Dipublikasikan'?'<span class="badge green">Dipublikasikan</span>':s[5]==='Draft'?'<span class="badge gray">Draft</span>':'<span class="badge amber">Belum lengkap</span>',`<button class="btn small" data-student="${s[0]}">Tinjau</button>`]),['Siswa','Kelas','Nilai','Hadir','Perilaku','Skor akhir','Status',''])}</section>`}
function teacherHome(){return heading('Selamat datang, Rina','Berikut kelas dan tugas mengajar untuk semester ini.',`<button class="btn primary" data-page="attendance">Isi absensi&nbsp; →</button>`)+stats([['Kelas diampu','4','3 mapel · semester aktif','▦'],['Absensi hari ini','2 / 3','Satu kelas belum diisi','✓'],['Nilai perlu dilengkapi','18','Batas input 7 hari','▤'],['Penilaian perilaku','12 / 24','Periode tutup 30 Nov','♡']])+`<div class="layout"><section class="panel"><div class="panel-head"><div><h2>Kelas dan mata pelajaran</h2><span class="muted">Pilih kelas untuk mulai mengajar</span></div></div>${table([['8A','Matematika','32 siswa','<button class="btn small" data-page="grades">Buka kelas →</button>'],['8B','Matematika','30 siswa','<button class="btn small" data-page="grades">Buka kelas →</button>'],['7A','Matematika','34 siswa','<button class="btn small" data-page="grades">Buka kelas →</button>']],['Kelas','Mata pelajaran','Jumlah siswa','Aksi'])}</section><section class="panel"><div class="panel-head"><h2>Wali kelas 8A</h2><button class="btn small" data-page="report">Lihat kelas</button></div><div class="feed"><div class="feed-row"><div class="feed-icon">♙</div><div><b>32 siswa</b> terdaftar<small>Semester Ganjil 2026/2027</small></div></div><div class="feed-row"><div class="feed-icon">◷</div><div><b>7 laporan KPI</b> belum lengkap<small>Menunggu nilai dan penilaian perilaku</small></div></div><div class="feed-row"><div class="feed-icon">✎</div><div><b>Catatan wali kelas</b><small>Terakhir diperbarui 4 hari lalu</small></div></div></div></section></div>`}
function attendancePage(){return heading(role==='siswa'?'Riwayat kehadiran':'Absensi siswa','Catat kehadiran per pertemuan dan lihat riwayat dengan mudah.',`<button class="btn primary" data-action="Simpan absensi">Simpan absensi</button>`)+`<section class="panel"><div class="panel-head"><div><h2>Daftar kehadiran · Kelas 8A</h2><span class="muted">Matematika · Pertemuan ke-3</span></div><div class="filters"><input type="date" value="2026-10-20" aria-label="Tanggal"><select><option>Pertemuan 3</option><option>Pertemuan 2</option></select></div></div><div class="tabs"><button class="active">Daftar siswa</button><button>Rekap mingguan</button><button>Riwayat</button></div>${table([['Nadia Putri','<span class="badge green">Hadir</span>','—','✓'],['Rafi Maulana','<span class="badge amber">Izin</span>','Keperluan keluarga','✓'],['Salsa Nabila','<span class="badge green">Hadir</span>','—','✓'],['Dimas Pratama','<span class="badge red">Sakit</span>','Surat keterangan','✓'],['Alya Zahra','<span class="badge green">Hadir</span>','—','✓']],['Nama siswa','Status','Keterangan','Disimpan'])}</section>`}
function gradesPage(){return heading('Input nilai','Masukkan nilai mentah. Koreksi tersedia selama 7 hari sejak penyimpanan.',`<button class="btn" data-action="Unduh template nilai">↓&nbsp; Template Excel</button><button class="btn primary" data-action="Simpan nilai">Simpan nilai</button>`)+`<section class="panel"><div class="panel-head"><div><h2>Nilai Matematika · Kelas 8A</h2><span class="muted">KKM 75 · Bobot UH 40% · UTS 30% · UAS 30%</span></div><div class="filters"><select><option>UTS</option><option>UH ke-1</option><option>UAS</option></select></div></div><div class="banner"><div><b>Jendela edit 7 hari</b><br><span>Nilai yang telah tersimpan dapat dikoreksi sampai 27 Oktober 2026.</span></div><span class="badge green">Aktif</span></div>${table([['Nadia Putri','8A','92','<button class="btn small" data-action="Edit nilai Nadia">Ubah</button>'],['Rafi Maulana','8A','84','<button class="btn small" data-action="Edit nilai Rafi">Ubah</button>'],['Salsa Nabila','8A','—','<button class="btn small" data-action="Isi nilai Salsa">Isi nilai</button>'],['Dimas Pratama','8A','77','<button class="btn small" data-action="Edit nilai Dimas">Ubah</button>']],['Nama siswa','Kelas','Skor','Aksi'])}</section>`}
function parentHome(){return heading('Anak saya','Pilih anak untuk melihat perkembangan belajar semester ini.')+`<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))"><section class="panel"><div class="person"><div class="avatar">NP</div><div><strong>Nadia Putri</strong><small>Kelas 8A · NIS 008214</small></div></div><div class="progress-row" style="margin-top:19px"><div class="progress-label"><span>KPI semester</span><b>88,7 · Baik</b></div><div class="track"><div class="fill" style="width:88%"></div></div></div><button class="btn primary" style="margin-top:7px" data-student="Nadia Putri">Lihat rapor&nbsp; →</button></section><section class="panel"><div class="person"><div class="avatar" style="background:#f2e8d9;color:#805d35">AP</div><div><strong>Arga Pratama</strong><small>Kelas 5B · NIS 005106</small></div></div><div class="progress-row" style="margin-top:19px"><div class="progress-label"><span>KPI semester</span><b>Belum terbit</b></div><div class="track"><div class="fill" style="width:61%"></div></div></div><button class="btn" style="margin-top:7px" data-student="Arga Pratama">Lihat perkembangan&nbsp; →</button></section></div>`}function reportPage(){return heading(role==='orangtua'?'Rapor Nadia Putri':role==='siswa'?'Rapor saya':'Laporan siswa','Ringkasan belajar · Semester Ganjil 2026/2027',`<button class="btn" data-action="Unduh rapor">↓&nbsp; Unduh rapor</button>`)+`<div class="person panel" style="margin-bottom:16px"><div class="avatar">NP</div><div><strong>${selectedStudent}</strong><small>Kelas 8A · Wali kelas Rina Puspita · Tahun ajaran 2026/2027</small></div><span class="badge green" style="margin-left:auto">KPI dipublikasikan</span></div><div class="tabs"><button class="active">Ringkasan</button><button data-action="Buka nilai">Nilai</button><button data-page="attendance">Kehadiran</button><button data-action="Buka perilaku">Perilaku</button></div>${stats([['Nilai rata-rata','88,4','Di atas KKM semua mapel','▤'],['Kehadiran','96%','Hadir 82 · izin 2 · sakit 1','✓'],['Perilaku','Baik','Rata-rata 3,6 dari 4','♡'],['KPI semester','88,7','Dipublikasikan 18 Okt 2026','◉']])}<div class="layout"><section class="panel"><div class="panel-head"><h2>Nilai per mata pelajaran</h2><span class="muted">KKM ditampilkan per mapel</span></div>${table([['Matematika','92','86','88','89,2','<span class="badge green">Tuntas</span>'],['Bahasa Indonesia','88','84','91','87,6','<span class="badge green">Tuntas</span>'],['IPA','82','80','85','82,4','<span class="badge green">Tuntas</span>'],['Bahasa Inggris','90','87','—','88,5','<span class="badge green">Tuntas</span>']],['Mata pelajaran','UH','UTS','UAS','Rata-rata','Status'])}</section><section class="panel"><div class="panel-head"><h2>Catatan wali kelas</h2><span class="muted">Rina Puspita</span></div><p style="font-size:12px;line-height:1.7;color:#58655b;margin:0">Nadia menunjukkan kemajuan yang konsisten dan aktif berkolaborasi. Pertahankan kebiasaan belajar mandiri dan terus berani menyampaikan pendapat di kelas.</p><hr style="border:0;border-top:1px solid #edf0ec;margin:17px 0"><span class="muted">KPI hanya menampilkan hasil yang sudah dipublikasikan.</span></section></div>`}
function genericPage(){const titles={master:['Data master','Kelola data kelas, siswa, guru, mapel, dan penugasan.'],settings:['Pengaturan sekolah','Atur kebijakan akademik dan komponen penilaian.'],audit:['Audit perubahan','Riwayat perubahan data dan alasan koreksi.'],reports:['Laporan sekolah','Rekap pembelajaran lintas kelas dan semester.'],'teacher-attendance':['Kehadiran guru','Pantau kehadiran harian dan permohonan izin.'],behavior:['Penilaian perilaku','Isi penilaian siswa untuk periode yang sedang dibuka.'],'my-attendance':['Kehadiran saya','Catat waktu hadir dan ajukan izin bila diperlukan.'],announcements:['Pengumuman sekolah','Informasi terbaru untuk orang tua.'],schedule:['Jadwal pelajaran','Jadwal kelas dan mata pelajaran minggu ini.'],profile:['Profil saya','Informasi akun dan data siswa.']};const d=titles[current]||['Ruang kerja','Informasi semester berjalan.'];return heading(d[0],d[1])+`<div class="banner"><div><b>Bagian ini merupakan rancangan demo</b><br><span>Alur layar sudah disiapkan; fitur akan terhubung dengan data aplikasi pada tahap pengembangan.</span></div></div><section class="panel"><div class="panel-head"><h2>${d[0]}</h2><button class="btn primary" data-action="Buka ${d[0]}">Mulai&nbsp; →</button></div><div class="empty-note">Pilih tindakan untuk melihat contoh interaksi.</div></section>`}
function pageContent(){if(role==='admin'&&current==='home')return adminHome();if((role==='admin'||role==='kepsek')&&current==='kpi')return kpiPage();if(role==='guru'&&current==='home')return teacherHome();if(current==='attendance')return attendancePage();if(current==='grades')return gradesPage();if(role==='orangtua'&&current==='home')return parentHome();if(current==='report'||(role==='siswa'&&current==='home'))return reportPage();return genericPage()}
function render(){renderNav();el('#crumbTitle').textContent=roleData[role].menu.find(i=>i[1]===current)?.[0]||'Ringkasan';el('#page').innerHTML=pageContent();document.querySelectorAll('[data-page]').forEach(b=>{if(!b.dataset.bound){b.dataset.bound='1';b.addEventListener('click',()=>{if(roleData[role].menu.some(i=>i[1]===b.dataset.page)){current=b.dataset.page;render()}})}});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>toast(`${b.dataset.action} — simulasi berhasil`));document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{selectedStudent=b.dataset.student;current='report';el('#roleSelect').value=role;el('#userName').textContent=roleData[role].name;el('#userRole').textContent=roleData[role].label;el('#userAvatar').textContent=roleData[role].initial;render()})}
el('#roleSelect').addEventListener('change',e=>setRole(e.target.value));el('#mobileMenu').addEventListener('click',()=>el('#mobileNav').classList.toggle('open'));render();
</script>
